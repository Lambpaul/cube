<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cube</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Welcome text that fades out after 10s -->
    <div id="welcome-text">Welcome to the Cube</div>

    <!-- Cube name in top left (hidden initially) -->
    <div id="cube-name-display" class="hidden"></div>

    <!-- Settings button in top right -->
    <button id="settings-btn" title="Settings">⚙</button>

    <!-- Main cube container -->
    <div id="cube-container"></div>

    <!-- Settings modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <button class="modal-close" id="close-settings">×</button>
            <h2>Settings</h2>
            <div class="modal-section">
                <label for="cube-id-input">Join a Cube</label>
                <input type="text" id="cube-id-input" placeholder="Enter Cube ID">
                <button id="join-cube-btn">Join</button>
            </div>
            <div class="modal-section">
                <button id="create-cube-btn">Create New Cube</button>
            </div>
            <div class="modal-section" id="current-cube-section" class="hidden">
                <p><strong>Current Cube ID:</strong></p>
                <p id="current-cube-id"></p>
                <button id="copy-id-btn">Copy ID</button>
            </div>
        </div>
    </div>

    <!-- Name cube modal -->
    <div id="name-modal" class="modal hidden">
        <div class="modal-content">
            <h2>The Cube Awakens</h2>
            <p>Your devotion has earned you the right to name this Cube.</p>
            <input type="text" id="cube-name-input" placeholder="Enter a name" maxlength="30">
            <button id="confirm-name-btn">Confirm</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="cube.js"></script>
    <script src="script.js"></script>
</body>
</html>
