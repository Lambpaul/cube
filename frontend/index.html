<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cube</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Welcome text that fades out after 10s -->
    <div id="welcome-text">Welcome to the Cube</div>

    <!-- Mystical unlock message -->
    <div id="unlock-message" class="hidden"></div>

    <!-- Cube name and UI controls in top left -->
    <div id="top-left-panel" class="hidden">
        <div id="cube-name-display"></div>
        <button id="ui-toggle-btn" class="hidden" title="Toggle UI">▼</button>

        <!-- Dynamic UI Panel (appears based on cube progress) -->
        <div id="ui-panel" class="hidden">

        <!-- Color Selection (unlocked at 200 clicks) -->
        <div id="color-selection-panel" class="ui-section hidden">
            <h3>Color Selection</h3>

            <!-- Color Picked Display -->
            <div class="color-picked-display">
                <span>Color Picked:</span>
                <div id="color-picked-swatch" style="background: #FF0000;"></div>
            </div>

            <!-- Primary Colors -->
            <div id="primary-colors-section">
                <div class="color-buttons">
                    <button class="color-btn" data-color="#FF0000" style="background: #FF0000;" title="Red"></button>
                    <button class="color-btn" data-color="#0000FF" style="background: #0000FF;" title="Blue"></button>
                    <button class="color-btn" data-color="#FFFF00" style="background: #FFFF00;" title="Yellow"></button>
                </div>
            </div>

            <!-- Full Color Picker (unlocked after 100 worships each primary) -->
            <div id="full-color-picker-section" class="hidden">
                <div class="color-picker-controls">
                    <input type="color" id="full-color-picker" value="#FF0000">
                    <input type="text" id="color-hex-input" placeholder="#FF0000" maxlength="7" value="#FF0000">
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="color-actions">
                <button id="apply-outline-btn">Apply to Outline</button>
            </div>
        </div>

        <!-- Paint Mode (unlocked at 500 clicks) -->
        <div id="paint-mode-panel" class="ui-section hidden">
            <h3>Paint Mode</h3>
            <div class="paint-controls">
                <label>
                    <input type="checkbox" id="paint-mode-toggle">
                    Enable Paint Mode
                </label>
            </div>
        </div>

        <!-- 3D Mode Controls (unlocked at 10000 clicks) -->
        <div id="3d-mode-panel" class="ui-section hidden">
            <h3>3D Mode</h3>
            <div class="face-selector">
                <label for="face-select">Select Face:</label>
                <select id="face-select">
                    <option value="top">Top</option>
                    <option value="bottom">Bottom</option>
                    <option value="front">Front</option>
                    <option value="back">Back</option>
                    <option value="left">Left</option>
                    <option value="right">Right</option>
                </select>
            </div>
        </div>

        </div>
    </div>

    <!-- Settings button in top right -->
    <button id="settings-btn" title="Settings">⚙</button>

    <!-- Main cube container -->
    <div id="cube-container"></div>

    <!-- Settings modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <button class="modal-close" id="close-settings">×</button>
            <h2>Settings</h2>
            <div class="modal-section">
                <label for="cube-id-input">Join a Cube</label>
                <input type="text" id="cube-id-input" placeholder="Enter Cube Name">
                <button id="join-cube-btn">Join</button>
            </div>
            <div class="modal-section">
                <button id="create-cube-btn">Create New Cube</button>
            </div>
            <div class="modal-section dark-mode-section">
                <div class="dark-mode-control">
                    <label for="dark-mode-toggle-checkbox">Dark Mode</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="dark-mode-toggle-checkbox">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>
            <div class="modal-section" id="current-cube-section" class="hidden">
                <p><strong>Current Cube:</strong></p>
                <p id="current-cube-id"></p>
                <button id="copy-id-btn">Copy Name</button>
            </div>
        </div>
    </div>

    <!-- Name cube modal -->
    <div id="name-modal" class="modal hidden">
        <div class="modal-content">
            <h2>The Cube Awakens</h2>
            <p>Your devotion has earned you the right to name this Cube.</p>
            <input type="text" id="cube-name-input" placeholder="Enter a name" maxlength="30">
            <button id="confirm-name-btn">Confirm</button>
        </div>
    </div>

    <!-- Paint Grid Overlay (for 2D paint mode) -->
    <canvas id="paint-grid-canvas" class="hidden"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="cube.js"></script>
    <script src="script.js"></script>
</body>
</html>
